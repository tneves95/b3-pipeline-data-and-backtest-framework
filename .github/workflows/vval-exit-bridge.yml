name: VVAL legacy-exit causal bridge
on:
  pull_request:
    paths:
      - 'scripts/vval_exit_attribution.py'
      - '.github/workflows/vval-exit-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replays:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3
      - run: python scripts/monthly_maintenance_reaudit.py
      - run: python scripts/vval_exit_attribution.py
      - name: Assert inputs and checkpoints not altered
        run: git diff --exit-code -- research/monthly_reaudited_2014_2026 research/monthly_policy_corrected_2014_2026 research/monthly_tax_2014_2026 research/monthly_fail_audit_2014_2026
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vval-four-disputed-exits-bridge
          path: |
            research/monthly_allocation_reaudited_2014_2026/vval_forced_sales_counterfactuals.csv
            research/monthly_allocation_reaudited_2014_2026/vval_forced_sales_annual.csv
            research/monthly_allocation_reaudited_2014_2026/vval_shapley_attribution.csv
            research/monthly_allocation_reaudited_2014_2026/vval_legacy_to_reaudited_bridge.json
          retention-days: 90

name: Barsi v13 event replay

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_barsi_v13.py'
      - 'graham_v6_event_bridge/**'
      - 'research/graham_v6_comparison/**'
      - '.github/workflows/barsi-v13.yml'
  push:
    branches: [audit/graham-v6-coverage-7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-event-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned dependencies in an isolated environment
        run: |
          python3 -m venv /tmp/barsi-v13-venv
          /tmp/barsi-v13-venv/bin/pip install pytest==8.3.5 pandas==2.2.3 beautifulsoup4==4.13.3
      - name: Replay 38 paths and verify baseline, v12 and economic invariants
        run: |
          /tmp/barsi-v13-venv/bin/python -m pytest -q tests/test_graham_maintenance_v11.py tests/test_itsa_rights_v11_2.py tests/test_audit_v12.py tests/test_barsi_v13.py

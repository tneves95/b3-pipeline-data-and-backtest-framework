name: Protected winners - compare monthly cash allocation
on:
  pull_request:
    paths:
      - 'scripts/monthly_allocation_compare.py'
      - '.github/workflows/monthly-allocation-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 pandas==2.2.3 XlsxWriter==3.2.5 openpyxl==3.1.5
      - name: Compare protected-winner strategies
        run: python scripts/monthly_allocation_compare.py
      - name: Core regressions
        run: python -m pytest -q tests/test_monthly_policy_corrected.py tests/test_monthly_tax.py
      - name: Assert all frozen checkpoints unchanged
        run: git diff --exit-code -- research/monthly_policy_corrected_2014_2026 research/monthly_tax_2014_2026
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allocation-strategies-protected-winners-2014-2026
          path: research/monthly_allocation_comparison_2014_2026/
          retention-days: 90

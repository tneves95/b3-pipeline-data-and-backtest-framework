name: B00S V2 offline experiment
on:
  pull_request:
    paths: ['scripts/b00s_*.py', 'tests/test_b00s_*.py', 'research/b00s_four_variants_2014_2026/**', '.github/workflows/b00s-variants.yml']
  push:
    branches: [study/b00s-four-variants-2014-2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install pytest==8.3.5 pandas==2.2.3 -r requirements-attribution.txt
      - run: python -m pytest -q tests/test_b00s_variants.py tests/test_b00s_fundamentals.py tests/test_stage1_attribution.py tests/test_stage1_continuity.py
      - run: python scripts/b00s_fundamentals.py
      - run: python scripts/b00s_sensitivities.py
      - run: python scripts/b00s_variants.py --stage vval
      - run: python scripts/b00s_report.py
      - run: git diff --exit-code

name: IR 100k A and B2 economic replay
on:
  pull_request:
    paths:
      - 'scripts/*ir_100k*.py'
      - 'tests/test_ir_100k.py'
      - 'research/ir_100k_inputs/**'
      - 'research/ir_100k_results/**'
      - '.github/workflows/ir-100k.yml'
  push:
    branches: [scenario/ir-100k-a-b2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-fiscal-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 -m venv /tmp/ir-100k-venv
          /tmp/ir-100k-venv/bin/pip install pytest==8.3.5 pandas==2.2.3 beautifulsoup4==4.13.3
      - run: |
          /tmp/ir-100k-venv/bin/python -m pytest -q tests/test_graham_maintenance_v11.py tests/test_itsa_rights_v11_2.py tests/test_audit_v12.py tests/test_barsi_v13.py tests/test_ir_100k.py

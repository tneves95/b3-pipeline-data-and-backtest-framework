name: Percentage returns 2014-2026 stage 1

on:
  pull_request:
    paths:
      - 'scripts/*stage1*.py'
      - 'tests/test_returns_stage1.py'
      - 'tests/test_stage1_pit.py'
      - 'tests/test_stage1_continuity.py'
      - 'tests/test_stage1_resume.py'
      - 'tests/test_stage1_attribution.py'
      - 'requirements-attribution.txt'
      - 'research/returns_2014_2026_inputs/**'
      - 'research/returns_2014_2026_results/**'
      - 'research/returns_2014_2026_selection/**'
      - 'docs/checkpoint_returns_2014_2026_stage1.md'
      - 'docs/checkpoint_attribution_2014_2026.md'
      - '.github/workflows/returns-stage1.yml'
  push:
    branches: [study/returns-2014-2026-stage1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-annual-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install attribution and independent Excel validation dependencies
        run: python -m pip install pytest==8.3.5 pandas==2.2.3 -r requirements-attribution.txt
      - name: Verify exact attribution, ownership and immutable baseline
        run: python -m pytest -q tests/test_stage1_attribution.py
      - name: Reproduce only the attribution from frozen books
        run: python scripts/stage1_attribution.py
      - name: Check attribution artifacts are unchanged
        run: git diff --exit-code -- research/returns_2014_2026_results
  offline-percentage-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install test dependency
        run: python -m pip install pytest==8.3.5 pandas==2.2.3
      - name: Verify percentage calculations and missing-data policy offline
        run: python -m pytest -q tests/test_returns_stage1.py tests/test_stage1_pit.py tests/test_stage1_continuity.py tests/test_stage1_resume.py
      - name: Replay only the continuation from accepted positions
        run: |
          python scripts/stage1_resume.py --freeze-events
          python scripts/stage1_continuation_audit.py
          python scripts/returns_stage1.py
      - name: Check generated results are unchanged
        run: git diff --exit-code -- research/returns_2014_2026_results research/returns_2014_2026_selection docs/checkpoint_returns_2014_2026_stage1.md

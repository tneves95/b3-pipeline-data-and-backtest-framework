name: Audit actual evidence behind maintenance FAIL
on:
  pull_request:
    paths: ['scripts/audit_monthly_maintenance_fail.py', 'tests/test_monthly_maintenance_fail_audit.py', 'research/monthly_fail_audit_2014_2026/**', 'docs/auditoria_fail_permanencia_2014_2026.md', '.github/workflows/monthly-fail-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install pytest==8.3.5 pandas==2.2.3 openpyxl==3.1.5
      - run: python scripts/audit_monthly_maintenance_fail.py
      - run: python -m pytest -q tests/test_monthly_maintenance_fail_audit.py tests/test_monthly_policy_corrected.py tests/test_monthly_tax.py
      - run: git diff --exit-code -- research/monthly_fail_audit_2014_2026 research/monthly_policy_corrected_2014_2026 research/monthly_tax_2014_2026

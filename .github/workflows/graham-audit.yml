name: Graham audit checkpoint

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_graham_maintenance_v11.py'
      - 'tests/test_itsa_rights_v11_2.py'
      - 'tests/test_audit_v12.py'
      - 'graham_v6_event_bridge/**'
      - 'research/graham_v6_comparison/**'
      - '.github/workflows/graham-audit.yml'
  push:
    branches: [audit/graham-v6-coverage-7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-and-artifact-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4 ref verified 2026-10-07
      - name: Install test dependencies in an isolated environment
        run: |
          python3 -m venv /tmp/graham-audit-venv
          /tmp/graham-audit-venv/bin/pip install pytest==8.3.5 pandas==2.2.3 beautifulsoup4==4.13.3
      - name: Run economic invariants and frozen checkpoint integrity checks
        run: |
          /tmp/graham-audit-venv/bin/python -m pytest -q tests/test_graham_maintenance_v11.py tests/test_itsa_rights_v11_2.py tests/test_audit_v12.py
